[package]
name = "finance-tracker"
version = "0.1.0"
description = "Offline-first personal finance tracker"
authors = ["IronMore3265"]
license = "MIT"
repository = "https://github.com/IronMore3265/finance-tracker"
edition = "2021"
rust-version = "1.77.2"

[lib]
# `finance_tracker_lib`, not `finance-tracker`: a Rust crate name cannot contain
# a hyphen, and `main.rs` calls into this by name.
name = "finance_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3" }
tauri-plugin-log = "2"

# The desktop file saver in `src/platform/savers/tauri.ts` calls into exactly
# these two: a native Save dialog, then a write to the path it returned.
# Nothing else is registered, so nothing else is reachable from the web layer.
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
