<!doctype html>
<!--
  data-astryx-theme is load-bearing: Astryx theme CSS is scoped to this
  attribute. Without it the page silently renders with built-in defaults
  instead of the theme stylesheet that was loaded.
-->
<html lang="en" data-astryx-theme="neutral">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <title>Finance Tracker</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
